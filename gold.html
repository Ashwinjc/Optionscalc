<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Options Calculator (with Gamma)</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #161b22;
      --input-bg: #21262d;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --red: #da3633;
      --green: #238636;
      --blue-card: #1f2937;
      --border: #30363d;
      --btn-bg: #30363d;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 14px; display: flex; flex-direction: column; min-height: 100vh; }
    
    .header { text-align: center; margin-bottom: 12px; }
    .header h1 { font-size: 1.15rem; font-weight: 800; letter-spacing: 0.5px; }
    .header p { font-size: 0.75rem; color: var(--text-muted); }

    /* Responsive Grid */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .tile {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
    }
    .tile label { font-size: 0.65rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
    .tile input {
      background: var(--input-bg);
      border: 1px solid transparent;
      color: #fff;
      font-size: 1.15rem;
      font-weight: 700;
      padding: 6px 8px;
      border-radius: 6px;
      outline: none;
      width: 100%;
    }
    .tile input::placeholder { color: #484f58; font-weight: 400; font-size: 0.95rem; }
    .tile input:focus { border-color: var(--accent); }

    /* Delta input + sign button row */
    .delta-wrap {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .delta-wrap input {
      flex: 1;
    }
    .sign-btn {
      background: var(--btn-bg);
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 800;
      padding: 6px 12px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }
    .sign-btn:active {
      background: var(--accent);
      color: #fff;
    }

    /* Switch row */
    .switch-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 8px;
    }
    .switch-label { font-size: 0.85rem; font-weight: 600; }
    .toggle { position: relative; width: 46px; height: 26px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #30363d; transition: .2s; border-radius: 26px;
    }
    .slider:before {
      position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px;
      background-color: white; transition: .2s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #238636; }
    input:checked + .slider:before { transform: translateX(20px); }

    /* Metrics strip */
    .metrics {
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent);
      background: #111620;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
      margin-bottom: 10px;
    }

    /* Result Banners */
    .results { display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .banner {
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .banner.sl { background: var(--red); }
    .banner.target { background: var(--green); }
    .banner.rrr { background: var(--blue-card); border: 1px solid var(--border); display: none; }
    .banner .tag { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; opacity: 0.9; margin-bottom: 2px; }
    .banner .val { font-size: 1.9rem; font-weight: 800; letter-spacing: 0.5px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>OPTIONS CALCULATOR</h1>
    <p>Delta & Gamma Target / Stoploss Engine</p>
  </div>

  <div class="grid">
    <div class="tile">
      <label>Entered Price</label>
      <input type="number" id="s0" placeholder="e.g. 8951" step="any">
    </div>
    <div class="tile">
      <label>Premium Price</label>
      <input type="number" id="p0" placeholder="e.g. 305" step="any">
    </div>
    <div class="tile">
      <label>SL Underlying</label>
      <input type="number" id="sl_und" placeholder="e.g. 8945" step="any">
    </div>
    <div class="tile">
      <label>Target Underlying</label>
      <input type="number" id="tgt_und" placeholder="e.g. 8994" step="any">
    </div>

    <!-- Delta Tile with +/- Button -->
    <div class="tile">
      <label>Delta (Δ)</label>
      <div class="delta-wrap">
        <input type="number" id="delta" placeholder="e.g. 0.50" step="any">
        <button type="button" class="sign-btn" onclick="toggleDeltaSign()">+ / −</button>
      </div>
    </div>

    <!-- Gamma Tile -->
    <div class="tile">
      <label>Gamma (Γ)</label>
      <input type="number" id="gamma" placeholder="e.g. 0.002" step="any">
    </div>

    <!-- Defined RRR (Spans full width if needed or keeps 2x-grid balanced) -->
    <div class="tile" style="grid-column: span 2;">
      <label>Defined RRR</label>
      <input type="number" id="rrr2" placeholder="e.g. 3.0" step="any">
    </div>
  </div>

  <!-- Switch Row -->
  <div class="switch-row">
    <span class="switch-label">Enable Defined RRR Target</span>
    <label class="toggle">
      <input type="checkbox" id="switch_rrr" onchange="calc()">
      <span class="slider"></span>
    </label>
  </div>

  <!-- Metrics Strip -->
  <div class="metrics" id="metrics_txt">
    SL Shift: -- | Target Shift: -- | RRR: --
  </div>

  <!-- Output Banners -->
  <div class="results">
    <div class="banner sl">
      <div class="tag">Stop Loss Premium</div>
      <div class="val" id="sl_val">--</div>
    </div>
    <div class="banner target">
      <div class="tag">Target Premium</div>
      <div class="val" id="tgt_val">--</div>
    </div>
    <div class="banner rrr" id="rrr_banner">
      <div class="tag" id="rrr_tag">Target @ Defined RRR</div>
      <div class="val" id="rrr_val">--</div>
    </div>
  </div>

  <script>
    const ids = ['s0', 'p0', 'sl_und', 'tgt_und', 'delta', 'gamma', 'rrr2'];
    ids.forEach(id => document.getElementById(id).addEventListener('input', calc));

    function toggleDeltaSign() {
      const deltaInput = document.getElementById('delta');
      const val = deltaInput.value.trim();

      if (val === '') {
        deltaInput.value = '-';
      } else if (val.startsWith('-')) {
        deltaInput.value = val.substring(1);
      } else {
        deltaInput.value = '-' + val;
      }
      calc();
    }

    function calc() {
      const s0_val = document.getElementById('s0').value;
      const p0_val = document.getElementById('p0').value;
      const sl_val = document.getElementById('sl_und').value;
      const tgt_val = document.getElementById('tgt_und').value;
      const delta_val = document.getElementById('delta').value;
      const gamma_val = document.getElementById('gamma').value;
      const rrr2_val = document.getElementById('rrr2').value;
      const enabled = document.getElementById('switch_rrr').checked;
      const rrrBanner = document.getElementById('rrr_banner');

      if (s0_val === '' || p0_val === '' || sl_val === '' || tgt_val === '' || delta_val === '' || delta_val === '-') {
        document.getElementById('metrics_txt').innerText = "SL Shift: -- | Target Shift: -- | RRR: --";
        document.getElementById('sl_val').innerText = "--";
        document.getElementById('tgt_val').innerText = "--";
        if (enabled) {
          rrrBanner.style.display = 'flex';
          document.getElementById('rrr_val').innerText = "--";
        } else {
          rrrBanner.style.display = 'none';
        }
        return;
      }

      const s0 = parseFloat(s0_val);
      const p0 = parseFloat(p0_val);
      const sl_und = parseFloat(sl_val);
      const tgt_und = parseFloat(tgt_val);
      const delta = parseFloat(delta_val);
      const gamma = gamma_val !== '' ? parseFloat(gamma_val) : 0;

      // Price shifts on underlying
      const dS_sl = sl_und - s0;
      const dS_tgt = tgt_und - s0;

      // Taylor expansion: ΔP ≈ Δ * dS + 0.5 * Γ * (dS)^2
      const dP_sl = (delta * dS_sl) + (0.5 * gamma * Math.pow(dS_sl, 2));
      const dP_tgt = (delta * dS_tgt) + (0.5 * gamma * Math.pow(dS_tgt, 2));

      // Final exit premiums
      const exit_sl = Math.max(0, p0 + dP_sl);
      const exit_tgt = Math.max(0, p0 + dP_tgt);

      // Risk-to-Reward Ratio based on premium point shifts
      const risk_pts = Math.abs(p0 - exit_sl);
      const reward_pts = Math.abs(exit_tgt - p0);
      const rrr = risk_pts !== 0 ? (reward_pts / risk_pts) : 0;

      document.getElementById('metrics_txt').innerText = 
        `SL Shift: ${(dP_sl >= 0 ? '+' : '') + dP_sl.toFixed(2)}  |  Tgt Shift: ${(dP_tgt >= 0 ? '+' : '') + dP_tgt.toFixed(2)}  |  RRR: ${rrr.toFixed(2)}:1`;

      document.getElementById('sl_val').innerText = exit_sl.toFixed(2);
      document.getElementById('tgt_val').innerText = exit_tgt.toFixed(2);

      if (enabled) {
        rrrBanner.style.display = 'flex';
        if (rrr2_val !== '') {
          const rrr2 = parseFloat(rrr2_val);
          // Defined Target Premium based on defined ratio
          const tgt_rrr = exit_tgt < p0 ? (p0 - (risk_pts * rrr2)) : (p0 + (risk_pts * rrr2));
          document.getElementById('rrr_tag').innerText = `Target @ Defined RRR (${rrr2.toFixed(1)}:1)`;
          document.getElementById('rrr_val').innerText = Math.max(0, tgt_rrr).toFixed(2);
        } else {
          document.getElementById('rrr_tag').innerText = "Target @ Defined RRR";
          document.getElementById('rrr_val').innerText = "--";
        }
      } else {
        rrrBanner.style.display = 'none';
      }
    }
  </script>
</body>
</html>
